[project]
name = "oauth-service"
version = "0.1.0"
description = "Service to implement oauth2.1"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]>=0.142.2",
    "pwdlib[argon2]>=0.3.1",
    "sqlmodel>=0.0.48",
]

[tool.fastapi]
entrypoint = "src.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
